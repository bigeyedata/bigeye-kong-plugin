name: Integration Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pongo
        run: |
          git clone https://github.com/Kong/kong-pongo.git ~/.pongo
          echo "PATH=$PATH:$HOME/.pongo/pongo" >> $GITHUB_ENV
          mkdir -p ~/.local/bin
          ln -s ~/.pongo/pongo.sh ~/.local/bin/pongo
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run integration tests
        run: pongo run
        timeout-minutes: 10
